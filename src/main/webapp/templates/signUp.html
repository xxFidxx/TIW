<!DOCTYPE html>
<html lang="it">
<head>
  <meta charset="UTF-8">
  <title>Login</title>
  <link rel="stylesheet" href="css/register.css">
</head>
<body>

<div class="signUp-container">
  <h2>Sign up</h2>
  <form action="SignUp" method="POST">
    <label for="username">Username</label>
    <input type="text" id="username" name="username" required maxlength="45">

    <label for="password">Password</label>
    <input type="password" id="password" name="password" required maxlength="45">
    
    <label for="name">Name</label>
    <input type="text" id="name" name="name" required maxlength="45">
    
    <label for="surname">Surname</label>
    <input type="text" id="surname" name="surname" required maxlength="45">
    
	<label for="address">Address</label>
    <input type="text" id="address" name="address" required maxlength="100">
    
    <label for="addressNumber">Address Number</label>
<input type="number" id="addressNumber" name="addressNumber" required maxlength="4" pattern="^[1-9][0-9]{0,3}$">
   

    <button type="submit">Sign up</button>
  </form>
</div>

</body>
</html>
